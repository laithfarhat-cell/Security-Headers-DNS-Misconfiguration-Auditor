[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secaudit"
version = "1.0.1"
description = "Asynchronous Security Headers, TLS and DNS/E-mail misconfiguration auditor with weighted scoring, remediation guidance and CI/CD quality gates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Laith Farhat", email = "security@example.com" }]
keywords = [
  "security",
  "appsec",
  "http-headers",
  "owasp",
  "dns",
  "dmarc",
  "spf",
  "dnssec",
  "tls",
  "sarif",
  "subdomain-takeover",
  "compliance",
  "devsecops",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: Name Service (DNS)",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
  "httpx>=0.27,<1.0",
  "dnspython>=2.6,<3.0",
  "cryptography>=42.0",
  "PyYAML>=6.0,<7.0",
  "rich>=13.7,<15.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "build>=1.0",
]

[project.scripts]
secaudit = "main:main"
domain-audit = "main:main"

[project.urls]
Homepage = "https://github.com/laithfarhat-cell/Security-Headers-DNS-Misconfiguration-Auditor"
Repository = "https://github.com/laithfarhat-cell/Security-Headers-DNS-Misconfiguration-Auditor"
Issues = "https://github.com/laithfarhat-cell/Security-Headers-DNS-Misconfiguration-Auditor/issues"
Changelog = "https://github.com/laithfarhat-cell/Security-Headers-DNS-Misconfiguration-Auditor/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["main"]
packages = ["auditors", "core", "reporters", "data", "config"]
include-package-data = true

[tool.setuptools.package-data]
data = ["*.json"]
config = ["*.yaml"]
core = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = [
  "ignore:ssl.TLSVersion.TLSv1:DeprecationWarning",
  "ignore:ssl.TLSVersion.TLSv1_1:DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [".git", "build", "dist", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
