name: Domain Security Audit

# Continuous security-posture monitoring for the domains you own.
#
#  * Add your domains to `domains.txt` (copy `domains.example.txt`) or pass the
#    `domains` input when running the workflow manually.
#  * With no targets configured the audit is skipped with a notice instead of
#    failing the build, so the workflow is green out of the box.
#  * Results are published as SARIF in the Security tab and as report artifacts.
#
# Optional repository variables (Settings → Secrets and variables → Actions → Variables):
#   AUDIT_FAIL_UNDER        minimum overall score (default: 85, 0 disables the score gate)
#   AUDIT_FAIL_ON_SEVERITY  critical | high | medium | low | none (default: critical)

on:
  schedule:
    # Every Monday at 04:17 UTC — off the hour to avoid CI peaks.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      domains:
        description: "Comma separated domains (overrides domains.txt)"
        required: false
        default: ""
      fail_under:
        description: "Minimum overall score, 0 disables the score gate (default: 85)"
        required: false
        default: ""
      fail_on_severity:
        description: "Fail on findings at/above this severity: critical, high, medium, low, none"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - ".github/workflows/domain-audit.yml"
      - "domains.txt"
      - "main.py"
      - "auditors/**"
      - "core/**"
      - "reporters/**"
      - "pyproject.toml"
      - "requirements.txt"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/domain-audit.yml"
      - "main.py"
      - "auditors/**"
      - "core/**"
      - "reporters/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"

permissions:
  contents: read
  security-events: write # required for the SARIF upload
  actions: read

concurrency:
  group: domain-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dispatch inputs win, then repository variables, then sensible defaults.
  FAIL_UNDER: ${{ github.event.inputs.fail_under || vars.AUDIT_FAIL_UNDER || '85' }}
  FAIL_ON_SEVERITY: ${{ github.event.inputs.fail_on_severity || vars.AUDIT_FAIL_ON_SEVERITY || 'critical' }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint + unit tests for the auditor itself (runs on pushes and pull requests).
  # ---------------------------------------------------------------------------
  quality:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

  # ---------------------------------------------------------------------------
  # 2. Resolve the target list. Never fails: an empty list simply skips the audit
  #    so that a repository without configured domains stays green.
  # ---------------------------------------------------------------------------
  preflight:
    name: Resolve targets
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_targets: ${{ steps.resolve.outputs.has_targets }}
      count: ${{ steps.resolve.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target list
        id: resolve
        shell: bash
        env:
          INPUT_DOMAINS: ${{ github.event.inputs.domains }}
        run: |
          set -euo pipefail

          normalise() {
            # Strip comments, CRLF, surrounding whitespace and blank lines.
            sed 's/#.*//' | tr -d '\r' \
              | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
              | grep -v '^$' || true
          }

          : > targets.txt
          if [ -n "${INPUT_DOMAINS:-}" ]; then
            printf '%s\n' "$INPUT_DOMAINS" | tr ',' '\n' | normalise >> targets.txt
          elif [ -f domains.txt ]; then
            normalise < domains.txt >> targets.txt
          fi
          # De-duplicate while preserving order.
          awk '!seen[$0]++' targets.txt > targets.dedup && mv targets.dedup targets.txt

          count=$(wc -l < targets.txt | tr -d ' ')
          echo "count=${count}" >> "$GITHUB_OUTPUT"

          if [ "${count}" -gt 0 ]; then
            echo "has_targets=true" >> "$GITHUB_OUTPUT"
            {
              echo "### 🎯 Targets (${count})"
              echo
              sed 's/^/- `&`/' targets.txt
            } >> "$GITHUB_STEP_SUMMARY"
            sed 's/^/  - /' targets.txt
          else
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⏭️ Domain audit skipped"
              echo
              echo "No targets are configured, so there is nothing to audit."
              echo
              echo "Add a \`domains.txt\` at the repository root (copy \`domains.example.txt\`),"
              echo "or run this workflow manually with the \`domains\` input."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Domain audit skipped::No domains.txt and no 'domains' input — nothing to audit."
          fi

      - name: Upload target list
        if: steps.resolve.outputs.has_targets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: secaudit-targets
          path: targets.txt
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Audit the configured domains (only when there is something to audit).
  # ---------------------------------------------------------------------------
  audit:
    name: Audit domains
    needs: [quality, preflight]
    if: needs.preflight.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install secaudit
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Download target list
        uses: actions/download-artifact@v4
        with:
          name: secaudit-targets
          path: .

      - name: Run audit
        # The step fails on purpose when the quality gate is not met; the
        # reporting steps below still run so the team always gets the evidence.
        run: |
          echo "Auditing ${{ needs.preflight.outputs.count }} target(s):"
          sed 's/^/  - /' targets.txt
          secaudit \
            -iL targets.txt \
            --nameserver 1.1.1.1 \
            --nameserver 8.8.8.8 \
            -c 15 \
            --timeout 10 \
            --fail-under "${FAIL_UNDER:-85}" \
            --fail-on-severity "${FAIL_ON_SEVERITY:-critical}" \
            -oJ reports/audit.json \
            -oS reports/secaudit.sarif \
            -oM reports/audit.md \
            -oH reports/audit.html

      - name: Publish SARIF to the Security tab
        if: always() && hashFiles('reports/secaudit.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/secaudit.sarif
          category: secaudit-domain-posture

      - name: Job summary
        if: always() && hashFiles('reports/audit.md') != ''
        run: cat reports/audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always() && hashFiles('reports/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-${{ github.run_number }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn
